<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Castaway</title>
</head>
<body>
    <header class="header">
        <div class="header__logo">
            <img 
                src="./img/logo.svg" 
                alt="Logo Castaway" class="header__logo__img">
        </div>
        <nav class="header__nav">
            <ul class="header__nav__list">
                <li class="header__nav__list--item"><a href="#">Home</a></li>
                <li class="header__nav__list--item"><a href="#">Episode</a></li>
                <li class="header__nav__list--item"><a href="#">About</a></li>
                <li class="header__nav__list--item"><a href="#">Episode</a></li>
            </ul>
        </nav>
    </header>
    <main class="main">
        <section class="welcome">
            <div class="container">
                <div class="welcome__container">
                    <div class="welcome__img">
                        <img 
                            src="./img/man-1x.png" 
                            srcset="./img/man-2x.png 2x"
                            alt="Image Man" width="650" height="850">
                    </div>
                    <div class="welcome__about">
                        <div class="welcome__about__text">Take your podcast to the next <span>level</span></div>
                        <div class="welcome__about__listen">
                            <div class="welcome__about__listen__text">Listen on</div>
                            <div class="welcome__availableApp">
                                <img 
                                    src="./img/spotify-1x.png"
                                    srcset="./img/spotify-2x.png 2x" 
                                    alt="Icon Spotify" width="32" height="32">
                                <img 
                                    src="./img/red_app-1x.png"
                                    srcset="./img/red_app-2x.png 2x" 
                                    alt="Icon Red App" width="32" height="32">
                                <img 
                                    src="./img/soundcloud-1x.png"
                                    srcset="./img/soundcloud-2x.png 2x" 
                                    alt="Icon SoundCloud" width="32" height="32">
                                <img 
                                    src="./img/violet_app-1x.png"
                                    srcset="./img/violet_app-2x.png 2x" 
                                    alt="Icon Violet App" width="32" height="32">
                                <img 
                                    src="./img/white_app-1x.png"
                                    srcset="./img/white_app-2x.png 2x" 
                                    alt="Icon White App" width="32" height="32">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
